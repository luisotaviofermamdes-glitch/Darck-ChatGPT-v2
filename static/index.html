<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Darck ChatGPT</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand"><span>◈</span> <strong>Darck</strong> ChatGPT</div>
  <button id="newChat" class="primary">＋ Novo chat</button>
  <div class="section-title">Conversas</div>
  <div id="history"></div>
  <div class="sidebar-bottom">
    <div id="backendStatus">● verificando...</div>
    <div class="small">IA local • Android</div>
  </div>
</aside>

<main>
<header>
  <button id="menu" class="icon-btn">☰</button>
  <div>
    <div id="chatTitle">Novo chat</div>
    <div id="modelLabel" class="small">modelo local</div>
  </div>
  <div class="header-actions">
    <button id="clearChat" class="icon-btn" title="Apagar conversa">🗑</button>
  </div>
</header>

<section id="messages">
  <div id="welcome" class="welcome">
    <div class="logo">◈</div>
    <h1>Darck ChatGPT</h1>
    <p>Uma IA local rodando diretamente no seu Android.</p>
    <div class="examples">
      <button>Explique programação em Python</button>
      <button>Crie uma história curta</button>
      <button>Ajude-me com matemática</button>
      <button>Explique como funciona uma IA local</button>
    </div>
  </div>
</section>

<form id="composer">
  <textarea id="input" rows="1" autocomplete="off"
    placeholder="Digite sua mensagem..."></textarea>
  <button id="send" class="send" type="submit">➤</button>
</form>
<div class="hint">Enter envia • Shift+Enter quebra linha</div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
